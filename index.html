<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasksUpdater Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="left-section">  
            <div class="title">
                <h2>TasksUpdater</h2>
            </div>
        </div>

        <div class="right-section">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>

            <div class="datetime">
                <p id="day"></p>
                <h3 id="date"></h3>
                <p id="time"></p>
            </div>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="main-container">

        <!-- LEFT PANEL -->
        <div class="add-task-panel">
            <h3>Add New Task</h3>

            <label>Task Description</label>
            <textarea id="todo-input" placeholder="e.g. Buy groceries"></textarea>

            <button id="add-btn">+ Add Task</button>
        </div>

        <!-- RIGHT PANEL -->
        <div class="task-section">

            <div class="tabs">
                <button class="tab active" data-filter="all">All Tasks</button>
                <button class="tab" data-filter="completed">Completed</button>
                <button class="tab" data-filter="pending">Pending</button>
            </div>

            <ul id="todo-list" class="task-list"></ul>

        </div>
        <div class="quote-panel">
    <h3>Thought of the Day</h3>
    <p id="quote-text">Loading...</p>
</div>


    </div>

    <script src="script.js"></script>
</body>

</html>
