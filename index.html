<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo Vibe</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="left-section">
      <div class="title">
        <h2>ToDo Vibe</h2>
      </div>
    </div>

    <div class="right-section">
      <label class="switch">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>

      <div class="datetime">
        <p id="day"></p>
        <h3 id="date"></h3>
        <p id="time"></p>
      </div>
    </div>
  </header>

  <main>

  <div class="page-grid">

    <!-- LEFT COLUMN -->
    <div class="main-column">

      <!-- ADD TASK -->
      <div class="add-task-panel">
        <h3>Add New Task</h3>
        <div class="task-input-row">
          <input
            type="text"
            id="todo-input"
            placeholder="What do you need to do?"
            aria-label="Add a new task"
          />
          <button id="add-btn" type="button">Add</button>
        </div>
      </div>

      <!-- TASK LIST -->
      <div class="task-section">

        <div class="tabs">
          <button class="tab active" data-filter="all">All Tasks</button>
          <button class="tab" data-filter="completed">Completed</button>
          <button class="tab" data-filter="pending">Pending</button>
        </div>

        <ul id="todo-list" class="task-list"></ul>

      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="side-column">

      <div class="quote-panel">
        <h3>Thought of the Day</h3>
        <p id="quote-text">Loading...</p>
      </div>

      <div class="side-widget">
        <h4>Coming Soon</h4>
        <p>Streaks, priorities & insights</p>
      </div>

    </div>

  </div>

</main>


  <script src="script.js"></script>
</body>
</html>
